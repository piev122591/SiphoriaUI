<div class="product-grid">
  <div class="product-card" *ngFor="let p of products"
       [class.sold-out]="isProductSoldOut(p)"
       [attr.aria-disabled]="isProductSoldOut(p)"
       (click)="openProductModal(p)">
    <div class="img-wrap">
      <img [src]="p.image_url" loading="lazy" decoding="async" />
      <span class="sold-out-badge" *ngIf="isProductSoldOut(p)">Sold Out</span>
    </div>
    <h3>{{ p.name | titlecase }}</h3>
  </div>
</div>
