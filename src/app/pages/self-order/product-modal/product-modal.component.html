<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <!-- HEADER -->
    <div class="modal-header">
      <h2 class="modal-title">{{ product?.name }}</h2>
      <button class="close-btn" (click)="onClose()">✕</button>
    </div>

    <!-- IMAGE -->
    <div class="img-wrapper">
      <img [src]="product?.image_url" class="modal-img" />
    </div>

    <!-- PRICE -->
    <p class="price">₱{{ getPrice() }}</p>

    <!-- ✅ SIZE SELECT (BEST POSITION) -->
    <div class="size-container">
      <p class="label">Size</p>

      <div class="size-options">
        <button
          *ngFor="let p of productsWithSizes"
          [class.active]="selectedSize === p.size"
          [class.sold-out]="remaining(p) <= 0"
          [disabled]="remaining(p) <= 0"
          (click)="onSelectSize(p)"
        >
          {{ p.size | sizeLabel }}
          <small class="stock-tag" *ngIf="isSoldOut(p)">Sold out</small>
          <small class="stock-tag" *ngIf="!isSoldOut(p) && remaining(p) <= 0">Max in order</small>
          <small class="stock-tag low" *ngIf="isLowStock(p) && remaining(p) > 0">{{ remaining(p) }} left</small>
        </button>
      </div>
    </div>

    <!-- QUANTITY -->
    <div class="qty-control">
      <button (click)="decrease()">−</button>
      <span>{{ qty }}</span>
      <button (click)="increase()" [disabled]="qty >= maxQty">+</button>
    </div>

    <!-- SUBTOTAL -->
    <p class="subtotal">Subtotal: ₱{{ getPrice() * qty }}</p>

    <!-- ADD BUTTON -->
    <button class="add-btn" (click)="onAdd()"
      [disabled]="isAdding || (productsWithSizes.length > 0 && !selectedProductWithSize)">
      <span *ngIf="isAdding" class="btn-spinner"></span>
      <span *ngIf="!isAdding">
        {{ productsWithSizes.length > 0 && !selectedProductWithSize ? 'Select a size' : 'Add to Order' }}
      </span>
    </button>
  </div>
</div>
